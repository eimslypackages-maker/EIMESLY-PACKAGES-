name: Auto-Deploy Full-Stack App to Cloud Run

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: "cloud-run-deploy"
  cancel-in-progress: true

jobs:
  deploy-cloudrun:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloud Run configuration
        id: config
        env:
          HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          HAS_WIF: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
          SERVICE_NAME: ${{ vars.CLOUDRUN_SERVICE }}
        run: |
          if [ "$HAS_SA_KEY" = "true" ] || [ "$HAS_WIF" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloud Run deployment: add GCP_SA_KEY (or GCP_WIF_PROVIDER + GCP_SERVICE_ACCOUNT) and CLOUDRUN_SERVICE in GitHub repository Settings -> Secrets and variables -> Actions to enable automatic full-stack Cloud Run updates on git push." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Authenticate to Google Cloud (Service Account Key)
        if: steps.config.outputs.enabled == 'true' && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.config.outputs.enabled == 'true' && secrets.GCP_SA_KEY == '' && secrets.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and Deploy to Cloud Run
        if: steps.config.outputs.enabled == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUDRUN_SERVICE || 'eimesly-packages' }}
          region: ${{ vars.CLOUDRUN_REGION || 'europe-west2' }}
          project_id: ${{ vars.GCP_PROJECT_ID || 'mimetic-outlook-sc62s' }}
          source: .
